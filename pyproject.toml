[project]
name = "dishlist"
version = "0.6.0"
description = "Self-hosted potluck planner"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "jinja2",
    "python-multipart",
    "pydantic>=2.10,<3",
    "starlette<1.0",
    "click>=8.3.3",
    "prometheus-client>=0.20",
]

[project.scripts]
dishlist = "app.cli:cli"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "no_db: run without a test database or DATABASE_URL",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli.py"]

[tool.ruff]
line-length = 88
extend-exclude = ["docs/build.py"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PT",       # pytest style
    "PIE",
    "RUF",
    "S",        # bandit (security)
    "BLE",      # blind except
    "T20",      # stray print
    "PL",       # pylint
]
ignore = [
    "E501",     # line length is handled by the formatter
    "PLR2004",  # magic numbers (HTTP status codes read better inline)
    "PLR0913", "PLR0917",  # many params: FastAPI Form() handlers legitimately have many
    "PLR0911", "PLR0912", "PLR0915",  # complexity: revisit deliberately, not by lint
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLC0415"]
"app/cli.py" = ["PLC0415"]  # imports are lazy on purpose to keep `dishlist` startup fast

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Form", "fastapi.Depends", "fastapi.Query", "fastapi.Path",
    "fastapi.Body", "fastapi.File", "fastapi.Header", "fastapi.Cookie",
]

[tool.fastapi]
entrypoint = "app.main:app"
