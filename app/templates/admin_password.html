{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h4 fw-semibold mb-3">Set admin password</h1>
    <p class="text-muted small">
      Your browser will ask you to log in again with the new password.
    </p>
    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ form_action or url_for('admin_password_submit') }}">
      <div class="mb-3">
        <label class="form-label" for="new_password">New password</label>
        <input class="form-control" id="new_password" name="new_password" type="password"
               minlength="12" autocomplete="new-password" required />
        <div class="form-text">At least 12 characters.</div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="confirm_password">Confirm new password</label>
        <input class="form-control" id="confirm_password" name="confirm_password" type="password"
               minlength="12" autocomplete="new-password" required />
      </div>
      <button class="btn btn-primary" type="submit">Save password</button>
    </form>
  </div>
</div>
{% endblock %}
