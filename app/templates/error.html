{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4 text-center">
        <p class="text-uppercase text-muted small mb-1">Error {{ status_code }}</p>
        <h1 class="h4 mb-3">{{ status_phrase }}</h1>
        <p class="mb-4" data-error-message>{{ message }}</p>
        <div class="d-flex justify-content-center gap-2">
          <button type="button" class="btn btn-outline-secondary" onclick="history.back()">Go back</button>
          <a class="btn btn-primary" href="{{ url_for('landing') }}">Home</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
