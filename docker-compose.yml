services:
  dishlist:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Persist the SQLite database and any config files between restarts.
      # Not needed if you set DATABASE_URL to PostgreSQL below.
      - ./data:/app/data
    environment:
      PORT: "8000"
      # SQLite (default): leave unset.
      # PostgreSQL: DATABASE_URL=postgresql://user:password@host:5432/dishlist
      # DATABASE_URL: ""
      # Optional email via Resend. Leave unset to disable all email features.
      # RESEND_API_KEY: ""
      # RESEND_FROM: "DishList <potluck@example.com>"
      # PUBLIC_BASE_URL: "https://dish.example.com"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
